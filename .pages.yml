content:
  - name: core
    label: Core career facts
    type: group
    items:
      - name: identity
        label: Identity and positioning
        type: file
        path: content/identity.json
        format: json
        fields:
          - { name: id, type: string, readonly: true }
          - { name: displayName, label: Public name, type: string, required: true, readonly: true }
          - { name: professionalPrefix, label: Professional prefix, type: string }
          - { name: professionalTitleKey, type: string, readonly: true }
          - { name: specialisationKey, type: string, readonly: true }
          - name: location
            type: object
            fields:
              - { name: city, type: string, required: true }
              - { name: country, type: string, required: true }
          - { name: availabilityKey, type: string, readonly: true }
          - { name: publicContactIds, type: string, list: true }
          - { name: publicLinkIds, type: string, list: true }
          - { name: visibility, type: string, readonly: true }
      - name: contacts
        label: Contact links
        type: file
        path: content/contacts.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - name: type
            type: select
            options: { values: [email, phone, url] }
          - { name: value, type: string }
          - { name: labelKey, type: string, readonly: true }
          - { name: public, type: boolean }
          - { name: sourceRefs, type: string, list: true, hidden: true }
      - name: education
        label: Education
        type: file
        path: content/education.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - { name: degreeKey, type: string, readonly: true }
          - { name: fieldKey, type: string, readonly: true }
          - { name: organisationId, type: string }
          - { name: start, component: partial_date }
          - { name: end, component: partial_date }
          - { name: honoursKeys, type: string, list: true }
          - { name: dissertationId, type: string }
          - { name: relatedExperienceIds, type: string, list: true }
          - { name: sourceRefs, type: string, list: true, hidden: true }
      - name: languages
        label: Languages
        type: file
        path: content/languages.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - { name: languageTag, type: string }
          - { name: nameKey, type: string, readonly: true }
          - { name: proficiency, type: string, required: true }
          - { name: sourceRefs, type: string, list: true, hidden: true }
      - name: tools
        label: Tools and proficiency
        type: file
        path: content/tools.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - { name: label, type: string, required: true }
          - name: proficiency
            type: select
            options: { values: [practical, research, working, configuration] }
          - { name: evidenceIds, type: string, list: true }
          - { name: sourceRefs, type: string, list: true, hidden: true }

  - name: evidence_content
    label: Experience and portfolio
    type: group
    items:
      - name: experiences
        label: Experience records
        type: file
        path: content/experiences.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - { name: type, type: string }
          - { name: titleKey, type: string, readonly: true }
          - { name: organisationIds, type: string, list: true }
          - { name: locationKey, type: string, readonly: true }
          - { name: start, component: partial_date }
          - { name: end, component: partial_date }
          - { name: educationId, type: string }
          - { name: evidenceIds, type: string, list: true }
          - { name: sourceRefs, type: string, list: true, hidden: true }
      - name: projects
        label: Projects
        type: file
        path: content/projects.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - { name: type, type: string }
          - { name: name, type: string, required: true }
          - { name: titleKey, type: string, readonly: true }
          - { name: summaryKey, type: string, readonly: true }
          - { name: start, component: partial_date }
          - { name: end, component: partial_date }
          - { name: url, type: string }
          - { name: repositoryUrl, type: string }
          - { name: evidenceIds, type: string, list: true }
          - { name: sourceRefs, type: string, list: true, hidden: true }
      - name: publications
        label: Publications
        type: file
        path: content/publications.json
        format: json
        list: true
        fields:
          - { name: id, type: string, required: true }
          - { name: authors, type: string, required: true }
          - { name: year, type: number, required: true }
          - { name: title, type: text, required: true }
          - { name: venue, type: string, required: true }
          - { name: volume, type: string }
          - { name: pages, type: string }
          - { name: url, type: string }
          - { name: status, type: select, options: { values: [published, accepted, forthcoming] } }
          - { name: visibility, type: select, options: { values: [public, internal] } }
          - { name: sourceRefs, type: object, list: true, hidden: true, fields: [{ name: sourceId, type: string }, { name: locator, type: string }] }
      - name: case_studies
        label: Case studies
        type: file
        path: content/case-studies.json
        format: json
        list: true
        fields:
          - { name: id, type: string, readonly: true }
          - { name: index, type: string }
          - { name: titleKey, type: string, readonly: true }
          - { name: kickerKey, type: string, readonly: true }
          - { name: problemKey, type: string, readonly: true }
          - { name: contextKey, type: string, readonly: true }
          - { name: roleKey, type: string, readonly: true }
          - { name: analysisKey, type: string, readonly: true }
          - { name: deliverableKey, type: string, readonly: true }
          - { name: interpretationKey, type: string, readonly: true }
          - { name: evidenceIds, type: string, list: true }
          - { name: methodIds, type: string, list: true }
          - { name: toolIds, type: string, list: true }
          - { name: relatedExperienceIds, type: string, list: true }
          - { name: url, type: string }

  - name: profile_configurations
    label: Professional profile configuration
    type: collection
    path: profile-config
    format: json
    operations: { create: false, delete: false }
    fields:
      - { name: id, type: string, readonly: true }
      - { name: slug, type: string, readonly: true }
      - { name: nameKey, type: string, readonly: true }
      - { name: headlineKey, type: string, readonly: true }
      - { name: summaryKey, type: string, readonly: true }
      - { name: targetRoleKeys, type: string, list: true }
      - { name: experienceIds, type: string, list: true }
      - { name: evidencePriorityIds, type: string, list: true }
      - { name: caseStudyIds, type: string, list: true }
      - { name: projectIds, type: string, list: true }
      - { name: publicationIds, type: string, list: true }
      - { name: educationIds, type: string, list: true }
      - { name: skillGroupIds, type: string, list: true }
      - { name: toolIds, type: string, list: true }
